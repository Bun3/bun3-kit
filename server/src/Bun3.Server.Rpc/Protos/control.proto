syntax = "proto3";

option csharp_namespace = "Bun3.Server.Rpc.ControlMessages";

package bun3.control;

// Framework-owned messages on channel 0x01.
message Control {
  oneof body {
    Ping ping = 1;
    Pong pong = 2;
    Disconnect disconnect = 3;
  }
}

message Ping {
  int64 client_time_unix_ms = 1;
}

// The server echoes client_time_unix_ms unchanged — the client computes RTT.
message Pong {
  int64 client_time_unix_ms = 1;
}

// Sent best-effort by the server just before a reasoned kick. The client reports this code on disconnect.
message Disconnect {
  int32 code = 1;   // 1-99 framework-reserved, negative game-defined (same convention as Reply.Status)
}
