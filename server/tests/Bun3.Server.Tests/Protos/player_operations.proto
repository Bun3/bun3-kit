syntax = "proto3";
option csharp_namespace = "Bun3.Server.Tests.OperationsProtocol";
package player_operations;
message OperationRequest {
  int64 request_id = 1;
  oneof body { LoginRequest login = 10; GetBalanceRequest get_balance = 11; TransferRequest transfer = 12; }
}
message OperationResponse {
  int64 request_id = 1;
  int32 status = 2;
  oneof body { LoginResponse login = 10; GetBalanceResponse get_balance = 11; TransferResponse transfer = 12; }
}
message OperationUpdate { oneof body { BalanceChanged balance_changed = 10; } }
message LoginRequest { string key = 1; }
message LoginResponse { int64 balance = 1; }
message GetBalanceRequest {}
message GetBalanceResponse { int64 balance = 1; }
message TransferRequest { string id = 1; string target = 2; }
message TransferResponse { int64 balance = 1; }
message BalanceChanged { int64 balance = 1; }
