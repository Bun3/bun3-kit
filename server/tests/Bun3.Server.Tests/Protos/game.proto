syntax = "proto3";

option csharp_namespace = "Bun3.Server.Tests.GameProtocol";

package game;

// ---- Well-formed protocol (convention-compliant) ----
message Request {
  int64 request_id = 1;
  oneof body {
    GetServerTimeRequest get_server_time = 10;
    BuyItemRequest buy_item = 11;
  }
}

message Response {
  int64 request_id = 1;
  int32 status = 2;
  oneof body {
    GetServerTimeResponse get_server_time = 10;
    BuyItemResponse buy_item = 11;
  }
}

message Update {
  oneof body {
    BroadcastedUpdate broadcasted = 10;
  }
}

message GetServerTimeRequest {}
message GetServerTimeResponse { int64 unix_ms = 1; }
message BuyItemRequest { int32 item_id = 1; }
message BuyItemResponse { int32 remaining_gold = 1; }
message BroadcastedUpdate { string text = 1; }

// ---- For validation-failure tests (intentionally violating roots) ----
message MismatchRequest {
  int64 request_id = 1;
  oneof body {
    GetServerTimeRequest get_server_time = 10;
    BuyItemRequest buy_item = 11;
  }
}

// missing buy_item case + get_server_time field number mismatch (12 instead of 10)
message MismatchResponse {
  int64 request_id = 1;
  int32 status = 2;
  oneof body {
    GetServerTimeResponse get_server_time = 12;
  }
}

// duplicate-type validation — an error under Request/Update roots, allowed under Response
message DuplicatePayloadRequest {
  int64 request_id = 1;
  oneof body {
    GetServerTimeRequest first = 10;
    GetServerTimeRequest second = 11;
  }
}

message SharedResponse {
  int64 request_id = 1;
  int32 status = 2;
  oneof body {
    GetServerTimeResponse get_server_time = 10;
    GetServerTimeResponse buy_item = 11;
  }
}

// violating root with repeated request_id (for validation tests)
message RepeatedIdRequest {
  repeated int64 request_id = 1;
  oneof body {
    GetServerTimeRequest get_server_time = 10;
  }
}
